<svg xmlns="http://www.w3.org/2000/svg" width="34" height="12" viewBox="0 0 34 12">
  <!-- 自動ドアのガラス戸1枚（左の戸）。右の戸は左右反転して描かれます -->
  <rect width="34" height="12" fill="#b2def0" fill-opacity="0.88"/>
  <rect x="5" y="2" width="12" height="2" fill="#ffffff" fill-opacity="0.65"/>
  <rect x="1" y="1" width="32" height="10" fill="none" stroke="#7d8a92" stroke-width="2"/>
  <!-- 真ん中で合わさる側の太い枠 -->
  <rect x="31" y="0" width="3" height="12" fill="#7d8a92"/>
</svg>
