<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28" viewBox="0 0 24 28">
  <!-- ピクトグラムの人（男性） -->
  <defs><g id="fig"><circle cx="12" cy="4.6" r="3.6"/><rect x="7.2" y="9" width="9.6" height="9.4" rx="2.4"/><rect x="4.4" y="9.4" width="2.3" height="8.2" rx="1.15"/><rect x="17.3" y="9.4" width="2.3" height="8.2" rx="1.15"/><rect x="7.8" y="17" width="3.6" height="8.4" rx="1.3"/><rect x="12.6" y="17" width="3.6" height="8.4" rx="1.3"/></g></defs>
  <!-- 影 -->
  <ellipse cx="12" cy="26" rx="6.5" ry="1.7" fill="#000000" fill-opacity="0.2"/>
  <!-- 白いふち（背景が暗くても見えるように） -->
  <use href="#fig" fill="#ffffff" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 本体（色はここを変える） -->
  <use href="#fig" fill="#8a63d2"/>
</svg>
