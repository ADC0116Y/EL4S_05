<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぴったり入店ゲート</title>
<style>
  :root{
    --bg:#f6f3ee; --ink:#2b2622; --muted:#7a7068; --line:#e2dcd3;
    --accent:#e0533d; --ok:#2f9e6b; --teal:#165f80;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 28px;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:20px;margin:0;letter-spacing:.02em}
  .stats{display:flex;gap:14px;font-size:13px;color:var(--muted)}
  .stats b{color:var(--ink);font-size:15px}
  canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:manipulation;cursor:pointer}
  .controls{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
  #btn{flex:1;min-width:220px;font-size:22px;font-weight:800;padding:16px;border:none;border-radius:12px;
    background:var(--ink);color:#fff;cursor:pointer;transition:transform .05s, background .15s;font-family:inherit}
  #btn:active{transform:scale(.98)}
  #btn.open{background:var(--accent)}
  #btn.retry{background:var(--ok)}
  #btn:disabled{opacity:.5;cursor:default}
  .opt{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;user-select:none}
  .opt b{color:var(--ink);font-size:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .result{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px;display:none}
  .result.show{display:block}
  .result.ok{background:#e6f5ee;color:#1f6f4b}
  .result.under{background:#fdf2e1;color:#8a560f}
  .result.over{background:#fde8e4;color:#9b2d1d}
  .result .big{font-size:22px;font-weight:800;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ぴったり入店ゲート</h1>
    <div class="stats">
      <span>連続成功 <b id="streak">0</b></span>
      <span>最高記録 <b id="best">0</b></span>
    </div>
  </header>

  <canvas id="cv" width="800" height="660"></canvas>

  <div class="controls">
    <button id="btn">ゲートを開ける</button>
    <label class="opt"><input type="checkbox" id="showCount"> 入店人数を表示（かんたん）<span id="liveWrap" style="display:none">：<b id="live">0</b>人</span></label>
  </div>
  <div class="hint">スペースキー／画面タップでも操作できます。ゲートは1回開けて1回閉めたら判定。開いている時間が長いほど人の勢いが増します。</div>

  <div class="result" id="result"></div>
</div>

<script src="assets/config.js"></script>
<script src="game_config.js"></script>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 800, H = 660;
  const FONT = '"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';

  // ---- Layout ----
  const STORE = {x: 200, y: 40, w: 290, h: 150};
  const QUEUE = {x: 60, y: 420, w: 560, h: 215};
  const DOOR_X = STORE.x + STORE.w / 2;     // 入口の中心
  const DOOR_Y = STORE.y + STORE.h;         // 店の下辺 = ゲート位置
  const DOOR_HALF = 34;
  const QGATE_Y = QUEUE.y;                  // 行列の出口ゲート（ボタンで開閉）
  const QGATE_HALF = 28;
  const BUBBLE = {cx: 640, cy: 100, rx: 125, ry: 66};
  const BUBBLE_BOX = {x: 465, y: 30, w: 300, h: 140};

  // ---- Assets（assets/config.js で差し替え可能） ----
  const CFG = window.GAME_ASSETS || {};
  function loadImg(src){ if (!src) return null; const im = new Image(); im.src = src; return im; }
  function ok(im){ return !!(im && im.complete && im.naturalWidth > 0); }
  // 1枚ずつの画像（キー名は assets/config.js と asset_settings.html と同じ）
  const SINGLE_KEYS = ['background', 'store', 'queue', 'bubble', 'corridor',
                       'doorFrame', 'doorPanel', 'doorMat', 'doorSensorOff', 'doorSensorOn',
                       'gate', 'gatePost', 'gateLampOff', 'gateLampOn'];
  const DEFAULT_SRC = {people: CFG.people || []};
  const IMG = {people: (CFG.people || []).map(loadImg)};
  for (const k of SINGLE_KEYS) { DEFAULT_SRC[k] = [CFG[k]]; IMG[k] = loadImg(CFG[k]); }
  // 画像があれば描いて true、無ければ false（呼び出し側が内蔵の絵で代わりに描く）
  function drawImg(key, x, y, w, h){
    if (!ok(IMG[key])) return false;
    ctx.drawImage(IMG[key], x, y, w, h);
    return true;
  }
  function randomSprite(){ return IMG.people.length ? IMG.people[Math.floor(Math.random()*IMG.people.length)] : null; }
  const P_SIZE = CFG.personSize || {w: 24, h: 28};
  const P_ANCHOR = CFG.personAnchor || {x: P_SIZE.w / 2, y: P_SIZE.h / 2};

  // ---- 調整値（game_config.js で上書き。無い項目・おかしな値はここの標準値を使う） ----
  const GC = (() => {
    const def = {
      target: {min: 5, max: 18, bonusPerStreak: 1, bonusMax: 6},
      speed:  {start: 45, startPerStreak: 4, accel: 32, accelPerStreak: 7, personMin: 0.75, personMax: 1.35, response: 6},
      queue:  {count: 80, gap: 15, extraGap: 30, firstDistance: 14, sideJitter: 6},
      gate:   {stopDistance: 14, animSpeed: 18, judgeDelayMs: 900},
      store:  {walkSpeed: 220, approachSpeed: 120, doorSensor: 70},
      texts: {
        requestTop: '{target}人', requestBottom: 'ちょうだい！',
        okTitle: 'ぴったり！ 大成功', okDetail: '{target}人ちょうど入店。次はもっと勢いが強くなります。',
        okBubble: ['ぴったり！', 'ありがとう！'],
        underTitle: '{n}人足りない…', underDetail: '入店 {entered}人 ／ 指定 {target}人。慎重すぎて席が空いてしまいました。',
        underBubble: ['あと{n}人', '足りないよ…'],
        overTitle: '{n}人オーバー！', overDetail: '入店 {entered}人 ／ 指定 {target}人。店内がパンクしました。',
        overBubble: ['{n}人多い！', '入りきらない！'],
      },
    };
    const user = window.GAME_CONFIG || {};
    const out = {};
    for (const sec of Object.keys(def)) {
      out[sec] = {};
      for (const k of Object.keys(def[sec])) {
        const dv = def[sec][k], uv = user[sec] && user[sec][k];
        const valid = typeof dv === 'number' ? (typeof uv === 'number' && isFinite(uv))
                    : Array.isArray(dv) ? (Array.isArray(uv) && uv.length === dv.length)
                    : typeof uv === 'string';
        if (uv !== undefined && !valid) console.warn(`game_config.js: ${sec}.${k} の値が正しくないので標準値 ${JSON.stringify(dv)} を使います`);
        out[sec][k] = valid ? uv : dv;
      }
    }
    if (out.target.max < out.target.min) out.target.max = out.target.min;
    if (out.speed.personMax < out.speed.personMin) out.speed.personMax = out.speed.personMin;
    out.queue.gap = Math.max(1, out.queue.gap);
    out.queue.count = Math.max(0, Math.floor(out.queue.count));
    return out;
  })();
  const fmt = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const R = 9;
  const MIN_GAP = GC.queue.gap;

  // 行列の通り道（ゲート → 下へ → 行列の中をジグザグ）
  const PATH = (() => {
    const L = QUEUE.x + 28, Rr = QUEUE.x + QUEUE.w - 28;
    const rows = [QUEUE.y + 38, QUEUE.y + 86, QUEUE.y + 134, QUEUE.y + 182];
    const pts = [[DOOR_X, DOOR_Y + 4], [DOOR_X, rows[0]], [Rr, rows[0]], [Rr, rows[1]],
                 [L, rows[1]], [L, rows[2]], [Rr, rows[2]], [Rr, rows[3]], [L, rows[3]]];
    const segs = []; let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const len = Math.hypot(x2 - x1, y2 - y1);
      segs.push({x1, y1, x2, y2, len, start: total});
      total += len;
    }
    return {segs, total};
  })();
  const GATE_D = QGATE_Y - (DOOR_Y + 4);    // 通り道の上での行列ゲートの位置（店のドアからの距離）
  function pathPoint(d){
    d = Math.max(0, Math.min(PATH.total, d));
    for (const s of PATH.segs) {
      if (d <= s.start + s.len) {
        const t = (d - s.start) / s.len;
        return {x: s.x1 + (s.x2 - s.x1) * t, y: s.y1 + (s.y2 - s.y1) * t,
                nx: -(s.y2 - s.y1) / s.len, ny: (s.x2 - s.x1) / s.len};
      }
    }
    const s = PATH.segs[PATH.segs.length - 1];
    return {x: s.x2, y: s.y2, nx: 0, ny: 1};
  }

  // ---- UI ----
  const btn = document.getElementById('btn');
  const resultEl = document.getElementById('result');
  const streakEl = document.getElementById('streak');
  const bestEl = document.getElementById('best');
  const liveEl = document.getElementById('live');
  const liveWrap = document.getElementById('liveWrap');
  const showCount = document.getElementById('showCount');

  let best = 0;
  try { best = parseInt(localStorage.getItem('gateBest') || '0', 10) || 0; } catch(e) {}
  bestEl.textContent = best;
  let streak = 0;

  const COLORS = ['#2f7fd8','#e8504a','#2fae6e','#f0a020','#8a63d2','#e0609a'];

  let people, state, target, entered, seated, openTime, gateAnim, doorAnim = 0, doorOpen = false, judgeTimer = null,
      accel, vBase, spots, bubbleText, bubbleColor;

  function storeSpots(){
    const spots = [];
    const cols = 11, rows = 5;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      spots.push({
        x: STORE.x + 22 + c * ((STORE.w - 44) / (cols - 1)) + (Math.random()*6-3),
        y: STORE.y + 22 + r * ((STORE.h - 50) / (rows - 1)) + (Math.random()*6-3)
      });
    }
    for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [spots[i],spots[j]]=[spots[j],spots[i]]; }
    return spots;
  }

  function newRound(){
    clearTimeout(judgeTimer); judgeTimer = null;
    const T = GC.target, S = GC.speed, Q = GC.queue;
    target = Math.round(T.min) + Math.floor(Math.random() * (Math.round(T.max) - Math.round(T.min) + 1))
           + Math.round(Math.min(streak * T.bonusPerStreak, T.bonusMax));
    bubbleColor = '#2b2622';
    entered = 0; seated = 0; openTime = 0; gateAnim = 0;
    accel = S.accel + streak * S.accelPerStreak;   // 開いている間の加速（連続成功で上がる）
    vBase = S.start + streak * S.startPerStreak;
    spots = storeSpots();
    people = [];
    // d = 店のドアまでの距離（行列ゲートは d = GATE_D）。間隔をバラつかせて「固まって来る」瞬間を作る
    // 並ぶ人数：queue.count 人（0 なら行列エリアがいっぱいになるまで）。
    // 行列エリアに入りきらない人は、画面の外（行列の最後尾の先）で待っていて、列が進むと見えてくる。
    let d = GATE_D + Q.firstDistance;
    while (Q.count > 0 ? people.length < Q.count : d < PATH.total) {
      people.push({
        d, v: 0, x: 0, y: 0,
        side: (Math.random() * 2 - 1) * Q.sideJitter,
        mul: S.personMin + Math.random() * (S.personMax - S.personMin),
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        sprite: randomSprite(),
        passed: false, inside: false, spot: null, bob: Math.random() * 6.28
      });
      d += MIN_GAP + Math.random() * Math.random() * Math.max(0, Q.extraGap);
    }
    for (const p of people) placeOnPath(p);
    // 並んでいる人数より多くは指定しない
    target = Math.max(0, Math.min(target, people.length));
    bubbleText = [fmt(GC.texts.requestTop, {target}), fmt(GC.texts.requestBottom, {target})];
    state = 'ready';
    btn.textContent = 'ゲートを開ける';
    btn.className = '';
    btn.disabled = false;
    resultEl.className = 'result';
    resultEl.innerHTML = '';
    updateLive();
  }

  function placeOnPath(p){
    const pt = pathPoint(p.d);
    const squeeze = Math.min(1, p.d / 60);
    p.x = pt.x + pt.nx * p.side * squeeze;
    p.y = pt.y + pt.ny * p.side * squeeze;
  }

  function updateLive(){
    liveWrap.style.display = showCount.checked ? '' : 'none';
    liveEl.textContent = entered;
  }
  showCount.addEventListener('change', updateLive);

  function press(){
    if (state === 'ready') {
      state = 'open';
      btn.textContent = 'ゲートを閉める！';
      btn.className = 'open';
    } else if (state === 'open') {
      state = 'closed';
      btn.textContent = '判定中…';
      btn.className = '';
      btn.disabled = true;
      // 判定は、ゲートを通った人が全員店に入ってから（update 内で予約）
    } else if (state === 'result') {
      newRound();
    }
  }

  function judge(){
    state = 'result';
    const diff = entered - target;
    const v = {target, entered, n: Math.abs(diff)};
    const TX = GC.texts;
    let cls, kind;
    if (diff === 0) {
      streak++;
      if (streak > best) { best = streak; try { localStorage.setItem('gateBest', String(best)); } catch(e) {} }
      cls = 'ok'; kind = 'ok'; bubbleColor = '#2f9e6b';
    } else if (diff < 0) {
      streak = 0;
      cls = 'under'; kind = 'under'; bubbleColor = '#b06f12';
    } else {
      streak = 0;
      cls = 'over'; kind = 'over'; bubbleColor = '#c0392b';
    }
    const big = fmt(TX[kind + 'Title'], v), sub = fmt(TX[kind + 'Detail'], v);
    bubbleText = TX[kind + 'Bubble'].map(s => fmt(s, v));
    streakEl.textContent = streak;
    bestEl.textContent = best;
    resultEl.className = 'result show ' + cls;
    resultEl.innerHTML = `<span class="big">${esc(big)}</span>${esc(sub)}`;
    btn.textContent = 'もう一回';
    btn.className = 'retry';
    btn.disabled = false;
  }

  btn.addEventListener('click', press);
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (!btn.disabled) press(); });
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    const t = e.target;
    if (t && t !== btn && /^(INPUT|BUTTON|SUMMARY|TEXTAREA|SELECT)$/.test(t.tagName)) return; // 設定欄の操作は邪魔しない
    e.preventDefault(); if (!btn.disabled) press();
  });

  // ---- 画像の上書き（別ページ asset_settings.html で指定したもの） ----
  // 指定がなければ assets/config.js の画像を使う。設定ページで変更すると、開いているゲームにもすぐ反映される。
  function applySlot(key, srcs){
    srcs = (srcs || []).filter(Boolean);
    if (key === 'people') {
      IMG.people = srcs.map(loadImg);
      if (people) for (const p of people) p.sprite = randomSprite();
    } else {
      IMG[key] = loadImg(srcs[0]);
    }
  }
  function loadOverrides(){
    for (const key of Object.keys(DEFAULT_SRC)) {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem('gateImg:' + key) || 'null'); } catch (e) {}
      applySlot(key, Array.isArray(saved) && saved.length ? saved : DEFAULT_SRC[key]);
    }
  }
  loadOverrides();
  window.addEventListener('storage', e => { if (!e.key || e.key.startsWith('gateImg:')) loadOverrides(); });

  // ---- Simulation ----
  function update(dt){
    const gateOpen = state === 'open';
    gateAnim += ((gateOpen ? 1 : 0) - gateAnim) * Math.min(1, dt * GC.gate.animSpeed);
    if (gateOpen) openTime += dt;

    const surge = gateOpen ? vBase + accel * openTime : 0;
    const stopLine = GATE_D + GC.gate.stopDistance;   // 閉まっている時に行列の人が止まる位置
    let limit = -Infinity;                            // 前の人にぶつからないための位置
    let walkers = 0, nearDoor = false;
    for (const p of people) {
      if (p.inside) continue;
      // ゲートを通った人は、閉めた後も通路を歩いて店へ向かう
      const want = p.passed ? Math.max(surge * p.mul, GC.store.approachSpeed)
                 : gateOpen ? surge * p.mul : 0;
      p.v += (want - p.v) * Math.min(1, dt * GC.speed.response);
      let nd = p.d - p.v * dt;
      if (!p.passed && !gateOpen) {
        // 止まる位置より手前にいる人はその場で止まる（後ろへワープさせない）
        const stopAt = p.d >= stopLine ? stopLine : p.d;
        if (nd < stopAt) { nd = stopAt; p.v = 0; }
      }
      if (nd < limit) { nd = limit; p.v = Math.min(p.v, 0); }
      p.d = nd;
      if (!p.passed && p.d < GATE_D) {
        // 行列ゲートを通過 → 入店人数としてカウント
        p.passed = true;
        entered++;
        updateLive();
      }
      if (p.d < 0) {
        // 店のドアを通過 → 店内の席へ
        p.inside = true;
        p.x = DOOR_X; p.y = DOOR_Y;
        p.spot = spots[seated++ % spots.length];
      } else {
        placeOnPath(p);
        limit = p.d + MIN_GAP;
        if (p.passed) { walkers++; if (p.d < GC.store.doorSensor) nearDoor = true; }
      }
      if (p.v > 5) p.bob += dt * (6 + p.v / 25);
    }

    // 店の自動ドア：人が近づくと開く
    doorOpen = nearDoor;
    doorAnim += ((doorOpen ? 1 : 0) - doorAnim) * Math.min(1, dt * GC.gate.animSpeed);

    // 閉めた後、通路を歩いている人が全員入店したら判定
    if (state === 'closed' && walkers === 0 && judgeTimer === null) {
      judgeTimer = setTimeout(judge, Math.max(0, GC.gate.judgeDelayMs));
    }
    for (const p of people) {
      if (!p.inside) continue;
      const dx = p.spot.x - p.x, dy = p.spot.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d > 1) { const m = Math.min(d, GC.store.walkSpeed * dt); p.x += dx / d * m; p.y += dy / d * m; p.bob += dt * 10; }
    }
  }

  // ---- Drawing ----
  function drawPerson(p){
    const bobY = Math.sin(p.bob) * 1.6;
    if (ok(p.sprite)) {
      ctx.drawImage(p.sprite, p.x - P_ANCHOR.x, p.y - P_ANCHOR.y + bobY, P_SIZE.w, P_SIZE.h);
      return;
    }
    // 画像が無いときの代わり：ピクトグラムの人（person_*.svg と同じ形）
    const ox = p.x - 12, oy = p.y - 13 + bobY;
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 13, 6.5, 1.7, 0, 0, 6.28); ctx.fill();
    ctx.save();
    ctx.translate(ox, oy);
    ctx.lineJoin = 'round';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
    ctx.fill(PICTO); ctx.stroke(PICTO);
    ctx.fillStyle = p.color;
    ctx.fill(PICTO);
    ctx.restore();
  }
  const PICTO = new Path2D(
    'M15.6 4.6a3.6 3.6 0 1 1-7.2 0a3.6 3.6 0 1 1 7.2 0z' +            // 頭
    'M9.6 9h4.8a2.4 2.4 0 0 1 2.4 2.4v4.6a2.4 2.4 0 0 1-2.4 2.4h-4.8a2.4 2.4 0 0 1-2.4-2.4v-4.6a2.4 2.4 0 0 1 2.4-2.4z' + // 胴
    'M4.4 10.6a1.15 1.15 0 0 1 2.3 0v5.8a1.15 1.15 0 0 1-2.3 0z' +   // 左腕
    'M17.3 10.6a1.15 1.15 0 0 1 2.3 0v5.8a1.15 1.15 0 0 1-2.3 0z' +  // 右腕
    'M7.8 17h3.6v6.6a1.8 1.8 0 0 1-3.6 0z' +                          // 左脚
    'M12.6 17h3.6v6.6a1.8 1.8 0 0 1-3.6 0z');                         // 右脚

  function drawBox(b, label, img){
    if (ok(img)) { ctx.drawImage(img, b.x, b.y, b.w, b.h); return; }
    ctx.fillStyle = '#165f80';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.font = `bold 40px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2);
  }

  function drawBubble(){
    const {cx, cy, rx, ry} = BUBBLE;
    if (ok(IMG.bubble)) {
      const b = BUBBLE_BOX;
      ctx.drawImage(IMG.bubble, b.x, b.y, b.w, b.h);
    } else {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0d2b3a'; ctx.lineWidth = 2;
    // しっぽ（店の方を向く）
    const tipX = STORE.x + STORE.w - 20, tipY = STORE.y + STORE.h * 0.62;
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.78, cy + ry * 0.35);
    ctx.lineTo(tipX, tipY);
    ctx.lineTo(cx - rx * 0.55, cy + ry * 0.72);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 6.28); ctx.fill(); ctx.stroke();
    // しっぽと楕円のつなぎ目を消す
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.76, cy + ry * 0.38);
    ctx.lineTo(tipX + 4, tipY - 2);
    ctx.lineTo(cx - rx * 0.57, cy + ry * 0.68);
    ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = bubbleColor;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 36px ${FONT}`;
    ctx.fillText(bubbleText[0], cx, cy - 16);
    ctx.font = `bold 22px ${FONT}`;
    ctx.fillText(bubbleText[1], cx, cy + 22);
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fbfaf7'; ctx.fillRect(0, 0, W, H);
    if (ok(IMG.background)) ctx.drawImage(IMG.background, 0, 0, W, H);

    // 通路（店の入口から行列まで）
    if (!drawImg('corridor', DOOR_X - 24, DOOR_Y, 48, QUEUE.y - DOOR_Y + 4)) {
      ctx.fillStyle = '#ebe6dd';
      ctx.fillRect(DOOR_X - 24, DOOR_Y, 48, QUEUE.y - DOOR_Y + 4);
    }

    drawBox(QUEUE, '行列', IMG.queue);
    drawBox(STORE, '店', IMG.store);

    // 行列の通り道（ジグザグのロープ風ガイド。画像を使うときは画像側に描く）
    if (!ok(IMG.queue)) {
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 30; ctx.lineJoin = 'round';
    ctx.beginPath();
    PATH.segs.forEach((s, i) => { if (i === 0) ctx.moveTo(s.x1, Math.max(s.y1, QUEUE.y)); else ctx.lineTo(s.x1, s.y1); });
    const ls = PATH.segs[PATH.segs.length - 1]; ctx.lineTo(ls.x2, ls.y2);
    ctx.stroke();
    }

    // 店の入口（下辺に開口部）
    ctx.fillStyle = '#ebe6dd';
    ctx.fillRect(DOOR_X - DOOR_HALF, DOOR_Y - 6, DOOR_HALF * 2, 6);

    // 自動ドア前のマット
    const MAT_W = DOOR_HALF * 2 + 12, MAT_H = 26;
    if (!drawImg('doorMat', DOOR_X - MAT_W / 2, DOOR_Y + 8, MAT_W, MAT_H)) {
    ctx.fillStyle = '#6b6f73';
    roundRect(DOOR_X - MAT_W / 2, DOOR_Y + 8, MAT_W, MAT_H, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
    for (let y = DOOR_Y + 13; y < DOOR_Y + 8 + MAT_H - 3; y += 4) {
      ctx.beginPath(); ctx.moveTo(DOOR_X - MAT_W / 2 + 5, y); ctx.lineTo(DOOR_X + MAT_W / 2 - 5, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = `bold 10px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('自動ドア', DOOR_X, DOOR_Y + 8 + MAT_H / 2);
    }

    for (const p of people) if (p.inside) drawPerson(p);
    for (let i = people.length - 1; i >= 0; i--) {
      const p = people[i];
      if (!p.inside && p.d <= PATH.total) drawPerson(p);   // 最後尾より後ろの人は画面の外なので描かない
    }

    drawAutoDoor();
    drawQueueGate();

    drawBubble();
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  // 自動ドア：ガラス戸2枚が左右の戸袋へスライドして開く
  function drawAutoDoor(){
    const T = 12;                       // ドアの厚み（上から見た幅）
    const top = DOOR_Y - T / 2;
    const e = doorAnim * doorAnim * (3 - 2 * doorAnim); // なめらかに加減速
    const slide = DOOR_HALF * e;

    // 戸袋（開いたドアが収まる壁の部分）とレール
    const FW = DOOR_HALF * 4 + 8;
    if (!drawImg('doorFrame', DOOR_X - FW / 2, top - 3, FW, T + 6)) {
      ctx.fillStyle = '#0e4762';
      ctx.fillRect(DOOR_X - DOOR_HALF * 2 - 4, top - 3, DOOR_HALF + 4, T + 6);
      ctx.fillRect(DOOR_X + DOOR_HALF,         top - 3, DOOR_HALF + 4, T + 6);
      ctx.fillStyle = '#c9d1d6';
      ctx.fillRect(DOOR_X - DOOR_HALF * 2, DOOR_Y - 1, DOOR_HALF * 4, 2);
    }

    const panels = [
      {x: DOOR_X - DOOR_HALF - slide, half: 0},  // 左の戸
      {x: DOOR_X + slide,             half: 1},  // 右の戸
    ];
    for (const pn of panels) {
      const x = pn.x;
      if (ok(IMG.doorPanel)) {
        // 画像は左の戸。右の戸は左右反転して描く
        ctx.save();
        if (pn.half === 1) { ctx.translate(x + DOOR_HALF, 0); ctx.scale(-1, 1); ctx.drawImage(IMG.doorPanel, 0, top, DOOR_HALF, T); }
        else ctx.drawImage(IMG.doorPanel, x, top, DOOR_HALF, T);
        ctx.restore();
        continue;
      }
      // ガラス
      ctx.fillStyle = 'rgba(178,222,240,.88)';
      ctx.fillRect(x, top, DOOR_HALF, T);
      // 光の反射
      ctx.fillStyle = 'rgba(255,255,255,.65)';
      ctx.fillRect(x + 5, top + 2, DOOR_HALF * 0.35, 2);
      // サッシ（枠）
      ctx.strokeStyle = '#7d8a92'; ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, top + 1, DOOR_HALF - 2, T - 2);
      // 取っ手側の縦枠を太く（中央で合わさる部分）
      ctx.fillStyle = '#7d8a92';
      ctx.fillRect(pn.half === 0 ? x + DOOR_HALF - 3 : x, top, 3, T);
    }

    // センサー（ドア上部）。開いている間は緑に光る
    const sx = DOOR_X, sy = DOOR_Y - T / 2 - 12;
    if (drawImg(doorOpen ? 'doorSensorOn' : 'doorSensorOff', sx - 14, sy - 5, 28, 10)) return;
    ctx.fillStyle = '#2b2622';
    roundRect(sx - 14, sy - 5, 28, 10, 3); ctx.fill();
    ctx.fillStyle = doorOpen ? '#5fe39a' : '#ff6b57';
    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 6.28); ctx.fill();
    if (doorOpen) {
      ctx.fillStyle = 'rgba(95,227,154,.25)';
      ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 6.28); ctx.fill();
    }
  }

  // 行列の出口ゲート（ボタンで開閉）：バーが左の柱へ縮んで開く
  function drawQueueGate(){
    const x0 = DOOR_X - QGATE_HALF, y = QGATE_Y;
    const barLen = QGATE_HALF * 2 * (1 - gateAnim);
    if (ok(IMG.gate)) {
      const g = IMG.gate, f = 1 - gateAnim;
      if (barLen > 0.5) ctx.drawImage(g, g.naturalWidth * (1 - f), 0, g.naturalWidth * f, g.naturalHeight,
                                      x0, y - 4, barLen, 8);
    } else if (barLen > 0.5) {
      ctx.fillStyle = '#e0533d';
      ctx.fillRect(x0, y - 3, barLen, 6);
    }
    // 柱（左右）
    for (const px of [x0, DOOR_X + QGATE_HALF]) {
      if (drawImg('gatePost', px - 6, y - 6, 12, 12)) continue;
      ctx.fillStyle = '#2b2622';
      ctx.beginPath(); ctx.arc(px, y, 6, 0, 6.28); ctx.fill();
    }
    // ランプ（開いている間は緑）
    const lx = DOOR_X + QGATE_HALF + 18, ly = y - 14;
    if (!drawImg(state === 'open' ? 'gateLampOn' : 'gateLampOff', lx - 8, ly - 8, 16, 16)) {
      ctx.fillStyle = state === 'open' ? '#2f9e6b' : '#e0533d';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(lx, ly, 7, 0, 6.28); ctx.fill(); ctx.stroke();
    }
  }

  function fit(){
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fit);
  fit();

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  newRound();
  requestAnimationFrame(loop);
})();
</script>
</body>
